name: Deploy Firebase Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd functions
          npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up Google Cloud credentials
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > "functions/serviceAccountKey.json"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ github.workspace }}/functions/serviceAccountKey.json"

      - name: Set environment variables
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> functions/.env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> functions/.env

      - name: Deploy Firebase Functions
        run: |
          firebase deploy --only functions --non-interactive --debug
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ github.workspace }}/functions/serviceAccountKey.json"

      - name: Remove credentials file
        if: success() || failure()
        run: |
          rm functions/serviceAccountKey.json
          rm functions/.env
